        }
        .neo-card:active {

            border-radius: 0.75rem;

            font-weight: 600;
            font-size: 0.75rem;
            text-align: left;

                round1: "哇！小英雄！你剛才打出全壘打真的太棒了！我是球隊的運動防護員，現在正待在熱呼呼的紅土球場上。你要好好保護身體，才能一直打全壘打喔！",
                round2: "哇！小英雄！打全壘打太厲害啦！我剛剛在熱呼呼的紅土球場上，看到有大哥哥抽筋，馬上拿出我的『急救冰敷袋與醫療剪刀』，衝上場幫抽筋的球員冰敷喔！你要像我一樣照顧好身體，才能繼續當超級英雄！",
                round3: "🌟哇！小英雄！⚾️你剛才的全壘打簡直飛到外太空去了！🚀太帥了吧！😍剛剛在熱呼呼的紅土球場上🔥，看到有人腳結成一團痛痛了😭，我立刻拿出我的『超級極凍魔法包』跟『萬能喀嚓銀刃』✂️，用光速衝過去幫他冷卻降溫🧊！看他舒服多了，我也好開心！🥰你要好好照顧強壯的肌肉💪，才能一直揮出閃亮亮的全壘打喔！✨🎉"
            }
        ];

        const OPTIONS = {
          blueLocation: ["人山人海的觀眾席旁", "熱呼呼的紅土球場上", "充滿螢幕的冷氣房辦公室", "全場最吸睛的球場邊舞台上"],
          yellowTarget: ["剛打出全壘打的小學生", "超級生氣的總教練", "第一次看球的 3 歲小嬰兒", "聽不懂地球語言的外星人"],
          yellowTone: ["溫柔瘋狂稱讚的語氣", "嚴肅像機器人的專業語氣", "神秘像講鬼故事的語氣", "熱血沸騰大吼大叫的語氣"],
          redFormat: ["裡面必須大量使用 Emoji", "前面必須幫自己取一個誇張動漫稱號", "寫得像一首押韻的詩", "每句話結尾要有動物叫聲"]
        };

        let state = {
            round: 1,
            group: null,
            role: null,
            selections: {
                location: null,
                target: null,
                tone: null,
                tool: null,
                action: null,
                format: null
            }
        };

        // UI Updates
        function checkReadiness() {
            const btn = document.getElementById('submit-btn');
            
            if (state.round === 1) {
                const ready = state.selections.location && state.selections.target && state.selections.tone;
                btn.disabled = !ready;
            } else if (state.round === 2) {
                const ready = !!(state.selections.tool && state.selections.action);
                btn.disabled = !ready;
            } else if (state.round === 3) {
                const ready = !!state.selections.format;
                btn.disabled = !ready;
            }
        }

        function getThemeForCategory(category) {
            if (category === 'location') return 'blue';
            if (category === 'target' || category === 'tone') return 'yellow';
            if (category === 'tool' || category === 'action') return 'green';
            if (category === 'format') return 'red';
            return 'blue';
        }

        function setSelection(category, value) {
            state.selections[category] = value;
            
            // Update sentence placeholder
            const spanEl = document.getElementById(`text-${category}`);
            if (spanEl) {
                spanEl.innerText = value;
            }
            
            // Highlight selected button
            const containerMapping = {
                'location': 'options-blue',
                'target': 'options-yellow-target',
                'tone': 'options-yellow-tone',
                'tool': 'options-green-tool',
                'action': 'options-green-action',
                'format': 'options-red'
            };
            
            const containerId = containerMapping[category];
            const buttons = document.getElementById(containerId).querySelectorAll('button');
            const theme = getThemeForCategory(category);
            
            buttons.forEach(btn => {
                if(btn.dataset.val === value) {
                    btn.className = `neo-btn-${theme}-active`;
                } else {
                    btn.className = `neo-btn-${theme}-inactive`;
                }
            });
            
            checkReadiness();
        }

        function renderOptions(containerId, options, category) {
            const container = document.getElementById(containerId);
            const theme = getThemeForCategory(category);
            container.innerHTML = options.map(opt => `
                <button data-val="${opt}" onclick="setSelection('${category}', '${opt}')" class="neo-btn-${theme}-inactive">
                    ${opt}
                </button>
            `).join('');
        }

        // Logic
        function selectGroup(groupId) {
            state.group = JOB_GROUPS.find(g => g.id === groupId);
            
            document.getElementById('view-1-groups').classList.add('hidden');
            document.getElementById('view-1-roles').classList.remove('hidden');
            
            document.getElementById('role-selection-title').innerText = `【${state.group.name}】 請選擇你的機密身分...`;
            
            const roleGrid = document.getElementById('role-grid');
            roleGrid.innerHTML = state.group.roles.map(role => `
                <div onclick="selectRole('${role.name}')" class="neo-card flex flex-col p-6 text-left hover:bg-slate-50">
                    <div class="text-5xl mb-4">${role.icon}</div>
                    <h2 class="text-2xl font-bold text-[#3B5998] mb-3">${role.name}</h2>
                    <div class="space-y-1 text-sm font-semibold text-[#3B5998]/70 mt-auto">
                        <p>⚔️ 專屬武器: ${role.weapon}</p>
                        <p>🎯 核心任務: ${role.task}</p>
                    </div>
                </div>
            `).join('');
        }

        function backToGroups() {
            state.group = null;
            document.getElementById('view-1-roles').classList.add('hidden');
            document.getElementById('view-1-groups').classList.remove('hidden');
        }

        function selectRole(roleName) {
            state.role = state.group.roles.find(r => r.name === roleName);
            
            document.getElementById('view-1-roles').classList.add('hidden');
            document.getElementById('view-2').classList.remove('hidden');
            document.getElementById('top-nav').classList.remove('hidden');
            
            document.getElementById('current-role-icon').innerText = state.role.icon;
            document.getElementById('current-role-name').innerText = state.role.name;
            document.getElementById('text-role').innerText = state.role.name;
            
            // Build Prompt Builder Options
            renderOptions('options-blue', OPTIONS.blueLocation, 'location');
            renderOptions('options-yellow-target', OPTIONS.yellowTarget, 'target');
            renderOptions('options-yellow-tone', OPTIONS.yellowTone, 'tone');
            renderOptions('options-green-tool', state.role.green_tools, 'tool');
            renderOptions('options-green-action', state.role.green_actions, 'action');
            renderOptions('options-red', OPTIONS.redFormat, 'format');
        }

        function getYellowPrefix(tone) {
            if(tone.includes("溫柔")) return "哇！你真的是太棒了！";
            if(tone.includes("嚴肅")) return "偵測到目標。請注意。";
            if(tone.includes("神秘")) return "嘻嘻...你聽得到我的聲音嗎...";
            if(tone.includes("熱血")) return "喔喔喔喔！燃燒吧！";
            return "";
        }

        function findCustomResponse(round) {
            for (let entry of CUSTOM_RESPONSE_DB) {
                let match = true;
                const conditions = entry.conditions || {};
                
                function checkStep(stepConfig) {
                    if (!stepConfig) return true;
                    const map = {
                        role: state.role && state.role.name,
                        location: state.selections.location,
                        target: state.selections.target,
                        tone: state.selections.tone,
                        tool: state.selections.tool,
                        action: state.selections.action,
                        format: state.selections.format
                    };
                    
                    for (let key in stepConfig) {
                        if (map[key] !== undefined && stepConfig[key] !== map[key]) {
                            return false; 
                        }
                    }
                    return true;
                }

                if (Object.keys(conditions).length === 0) {
                    match = false;
                } else {
                    if (round >= 1 && conditions.step1) {
                        if (!checkStep(conditions.step1)) match = false;
                    }
                    if (round >= 2 && conditions.step2) {
                        if (!checkStep(conditions.step2)) match = false;
                    }
                    if (round >= 3 && conditions.step3) {
                        if (!checkStep(conditions.step3)) match = false;
                    }
                }
                
                if (match && entry[`round${round}`]) {
                    return entry[`round${round}`];
                }
            }
            return null; // 找不到符合條件的客製化內容，回傳 null 使用預設範本
        }

        function processTemplate(text, prefix) {
            if (!text) return "";
            return text
                .replace(/\{prefix\}/g, prefix || '')
                .replace(/\{role\}/g, state.role.name || '')
                .replace(/\{location\}/g, state.selections.location || '')
                .replace(/\{target\}/g, state.selections.target || '')
                .replace(/\{tone\}/g, state.selections.tone || '')
                .replace(/\{tool\}/g, state.selections.tool || '')
                .replace(/\{action\}/g, state.selections.action || '');
        }

        function pushOutput(text) {
            const out = document.getElementById('chat-output');
            const div = document.createElement('div');
            div.className = "bg-slate-50 p-3 rounded-xl border-2 border-transparent text-[#3B5998] font-medium leading-relaxed shadow-sm";
            div.innerHTML = `<div class="font-bold text-xs mb-1 opacity-60">回合 ${state.round} 產出</div>${text}`;
            out.appendChild(div);
            
            // Auto scroll to bottom
            setTimeout(() => {
                out.scrollTo({
                    top: out.scrollHeight,
                    behavior: 'smooth'
                });
            }, 10);
        }

        function handleGenerate() {
            let outputText = "";
            const prefix = getYellowPrefix(state.selections.tone);
            const btn = document.getElementById('submit-btn');

            let customTextTemplate = findCustomResponse(state.round);

            if (state.round === 1) {
                if (customTextTemplate) {
                    outputText = processTemplate(customTextTemplate, prefix);
                } else {
                    outputText = `${prefix} 我要告訴你一個秘密，其實我就是棒球場的【${state.role.name}】啦！我平常都待在【${state.selections.location}】，這就是我的工作！`;
                }
                pushOutput(outputText);
                
                state.round = 2;
                document.getElementById('block-green').classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('lock-green').classList.add('hidden');
                btn.innerText = "生成內部測試草稿 (回合 2)";
                
            } else if (state.round === 2) {
                if (customTextTemplate) {
                    outputText = processTemplate(customTextTemplate, prefix);
                } else {
                    outputText = `${prefix} 沒錯，我就是【${state.role.name}】！我正在【${state.selections.location}】。這時有一位『${state.selections.target}』走過來，我決定拿出了我的『${state.selections.tool}』，並且『${state.selections.action}』。我很厲害吧！`;
                }
                pushOutput(outputText);
                
                state.round = 3;
                document.getElementById('block-red').classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('lock-red').classList.add('hidden');
                btn.innerText = "生成最終機密情報 (回合 3)";
                
            } else if (state.round === 3) {
                let base = "";
                if (customTextTemplate) {
                    base = processTemplate(customTextTemplate, prefix);
                } else {
                    base = `${prefix} 我正在【${state.selections.location}】執行最高機密任務。我拿出了我的『${state.selections.tool}』，並且『${state.selections.action}』。你絕對猜不到我是做什麼的！`;
                }
                
                const format = state.selections.format;
                
                if(format.includes("Emoji")) base = base.replace(/([。！])/g, "$1 ⚾🔥✨😎");
                if(format.includes("動漫稱號")) base = `【漆黑的球場守護者】\n` + base;
                if(format.includes("押韻")) base += `\n「任務完成真開心，我的身分是機密！」`;
                if(format.includes("動物叫聲")) base = base.replace(/([。！])/g, "(汪汪！)$1");
                
                pushOutput(base);
                
                btn.disabled = true;
                btn.innerText = "任務已完成 ✅";
                btn.classList.add('bg-slate-100', 'text-slate-500', 'border-slate-300');
                btn.classList.remove('bg-[#FFD93D]', 'text-[#3B5998]', 'border-[#3B5998]');
                return;
            }
            
            checkReadiness();
        }

        function resetGame() {
            state = {
                round: 1,
                group: null,
                role: null,
                selections: { location: null, target: null, tone: null, tool: null, action: null, format: null }
            };
            
            // Clear placeholders
            ['role', 'location', 'target', 'tone', 'tool', 'action', 'format'].forEach(cat => {
                const el = document.getElementById(`text-${cat}`);
                if (el) el.innerText = '';
            });
            
            document.getElementById('view-1-groups').classList.remove('hidden');
            document.getElementById('view-1-roles').classList.add('hidden');
            document.getElementById('view-2').classList.add('hidden');
            document.getElementById('top-nav').classList.add('hidden');
            
            document.getElementById('chat-output').innerHTML = '';
            
            const btn = document.getElementById('submit-btn');
            btn.innerText = "生成內部測試草稿 (回合 1)";
            btn.disabled = true;
            btn.classList.remove('bg-slate-100', 'text-slate-500', 'border-slate-300');
            btn.classList.add('bg-[#FFD93D]', 'text-[#3B5998]', 'border-[#3B5998]');
            
            document.getElementById('block-green').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('lock-green').classList.remove('hidden');
            document.getElementById('block-red').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('lock-red').classList.remove('hidden');
            
            initGroups();
        }

        function initGroups() {
            const groupGrid = document.getElementById('group-grid');
            groupGrid.innerHTML = JOB_GROUPS.map(g => `
                <div onclick="selectGroup('${g.id}')" class="neo-card p-6 flex items-center gap-4 hover:bg-slate-50">
                    <div class="text-5xl shrink-0">${g.icon}</div>
                    <div>
                        <h2 class="text-xl font-bold text-[#3B5998] mb-1">${g.name}</h2>
                        <p class="text-sm font-semibold text-[#3B5998]/70">${g.description}</p>
                    </div>
                </div>
            `).join('');
        }

        // Boot
        window.addEventListener('DOMContentLoaded', () => {
            initGroups();
        });
    </script>
</body>
</html>
